<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bektel.com webmail</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="page">
      <main class="login-wrap">
        <form class="login-box" id="login-form" autocomplete="on" novalidate>
          <img
            class="logo"
            src="/assets/logo.png"
            alt="BEK"
            width="140"
            height="103"
            decoding="async"
          />

          <div class="field" data-field="email">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 12a4.25 4.25 0 1 0 0-8.5 4.25 4.25 0 0 0 0 8.5Z"
                  fill="currentColor"
                />
                <path
                  d="M4.5 19.25c0-3.45 3.36-6.25 7.5-6.25s7.5 2.8 7.5 6.25"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              placeholder="Email Address"
              autocomplete="username"
              required
            />
            <span class="field-affix" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect
                  x="3.5"
                  y="6"
                  width="17"
                  height="12.5"
                  rx="2"
                  stroke="#4ade80"
                  stroke-width="1.7"
                />
                <path
                  d="M4.5 7.5 12 13l7.5-5.5"
                  stroke="#4ade80"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </div>

          <div class="field" data-field="password">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect
                  x="6"
                  y="10.5"
                  width="12"
                  height="9"
                  rx="2"
                  fill="currentColor"
                />
                <path
                  d="M8.5 10.5V8.2a3.5 3.5 0 0 1 7 0v2.3"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />
          </div>

          <p class="error" id="error" hidden role="alert"></p>

          <button class="login-btn" type="submit" id="login-btn">
            <span class="btn-label">LOGIN</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>
      </main>

      <footer class="footer">
        <span>bektel.com webmail</span>
      </footer>
    </div>

    <script src="/js/app.js" defer></script>
  </body>
</html>
